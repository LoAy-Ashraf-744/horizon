ids = ["handle:PlayerRef::push_resource_pack", "handle:PlayerRef::pop_resource_pack", "type:ResourcePackOffer", "type:PlayerPackRefusal", "hook:resource_pack_status"]
why = "A mod can offer one connected player a resource pack in play (PlayerRef::push_resource_pack, with an id, URL, SHA-1, required flag and prompt) and take one or all of them off (pop_resource_pack), each refusal named. resource_pack_status now also gives the id of the pack an answer is for, so several pushed packs can be told apart."
migrate = "The new calls are additive. resource_pack_status contract version 2 adds pack: u128 after status; version 1 had no pack id and has no compatibility binding. Rebuild native and wasm listeners against this SDK. Today's injection manifest rejects hook_version; the version names the catalog/surface contract, not a supported manifest setting."
